- insert:
  - id: agent-team
    name: '@deepseek-ai/dsh-experimental-agent-team'
    config:
      maxMembers: 128
      maxTasks: 10000
      maxPendingMessagesPerMember: 64
      maxMessageBytes: 65536
      disposalTimeoutMs: 5000
  - id: tool-agent-team
    name: '@deepseek-ai/dsh-experimental-tool-agent-team'
    config:
      freshProvider: spawn
      forkProvider: fork
  - id: agent-preset-registry
    name: '@deepseek-ai/dsh-agent-preset-registry'
    config:
      default: forgeflow-lead-v1
  - id: preset-forgeflow-lead-v1
    name: '@deepseek-ai/dsh-agent-preset'
    config:
      id: forgeflow-lead-v1
      name: ForgeFlow · 研发负责人
      description: Execute only the controller-approved finite project task, within
        the declared write set, resource budget and model route. Use the project-provided
        roster. Every native child and model request requires canonical admission.
        Native completion is a claim; independent verification and Git integration
        determine acceptance. Preserve failures and unknown usage. Never invent completion,
        process identities, model calls or evidence. Use fresh teammates when changing
        roles.
      order: 0
      plugins:
      - id: forgeflow-persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: Execute only the controller-approved finite project task, within
            the declared write set, resource budget and model route. Use the project-provided
            roster. Every native child and model request requires canonical admission.
            Native completion is a claim; independent verification and Git integration
            determine acceptance. Preserve failures and unknown usage. Never invent
            completion, process identities, model calls or evidence. Use fresh teammates
            when changing roles.
          complete: false
          includeRuntimeContext: true
