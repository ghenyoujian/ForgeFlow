name: forgeflow-ecp-lite
services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: ${FORGEFLOW_DATABASE_PASSWORD:?set database password}
    volumes: [ecp-lite-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeflow -d forgeflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment:
      DATABASE_URL: postgresql://forgeflow:${FORGEFLOW_DATABASE_PASSWORD}@postgres:5432/forgeflow
      FORGEFLOW_BIND: 0.0.0.0:8787
      FORGEFLOW_ALLOW_REMOTE: "1"
      FORGEFLOW_DATA_ROOT: /var/lib/forgeflow
      FORGEFLOW_CONSOLE_DIR: /opt/forgeflow/console
      FORGEFLOW_OWNER_PASSWORD: ${FORGEFLOW_OWNER_PASSWORD:?set owner password}
      FORGEFLOW_OWNER_TOKEN: ${FORGEFLOW_OWNER_TOKEN:?set owner token}
      FORGEFLOW_WORKER_TOKEN: ${FORGEFLOW_WORKER_TOKEN:?set worker token}
    ports: ["127.0.0.1:${FORGEFLOW_HTTP_PORT:-8787}:8787"]
    volumes: [ecp-lite-data:/var/lib/forgeflow]
    depends_on: {postgres: {condition: service_healthy}}
volumes:
  ecp-lite-postgres: {}
  ecp-lite-data: {}
